name: Compare test runs with the base branch

# Runs the model on the test cases in test_data/ with the base branch of the
# PR (e.g. main) and with the PR, and posts the differences in melt, runoff,
# refreezing, sublimation and SMB as a PR comment. Same comparison as
# tools/compare_branches.bat / tools/compare_branches.py run locally.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the base branch is needed for the comparison

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install numpy pandas xarray netCDF4 numba scipy tqdm matplotlib pytz

      - name: Run the test cases with the base branch and with the PR
        id: compare
        run: |
          python tools/compare_branches.py --name ci --no-fetch \
            --base origin/${{ github.base_ref }} --out ci_results

      - name: Write report
        if: always()
        run: |
          {
            echo "## Test runs: PR vs ${{ github.base_ref }}"
            echo ""
            if [ -f ci_results/summary.md ]; then cat ci_results/summary.md; else echo "The comparison failed, see the workflow log."; fi
            echo ""
            echo "Figures: see the \`test-run-results\` artifact of this workflow run, or docs/PR_results/ if committed with the PR."
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post report as PR comment
        # not possible from forks: their token is read-only
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} --body-file report.md \
            --edit-last --create-if-none

      - name: Upload figures and tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-results
          path: ci_results
          if-no-files-found: ignore
